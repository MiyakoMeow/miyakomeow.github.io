<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Redirecting to brightmeows.com</title>
    <link rel="canonical" href="https://brightmeows.com/" />
    <meta http-equiv="refresh" content="0; url=https://brightmeows.com/" />
    <script>
      const target =
        "https://brightmeows.com" +
        location.pathname +
        location.search +
        location.hash;
      location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://brightmeows.com/">brightmeows.com</a>.</p>
  </body>
</html>
